[toolchain]
anchor_version = "0.31.1"
solana_version = "2.1.21"

[features]
resolution = true
skip-lint = false

[programs.devnet]
breakglass = "AiMhNgDgXLQ68FhZrYczUiGxDxDeDxNFDTurqNFPP5kB"
test_vault = "2orgNn8kfHVQi8EMxa86zntq8BbwQefXPtpZiQTfgPyn"

[programs.localnet]
breakglass = "AiMhNgDgXLQ68FhZrYczUiGxDxDeDxNFDTurqNFPP5kB"
test_vault = "2orgNn8kfHVQi8EMxa86zntq8BbwQefXPtpZiQTfgPyn"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Explicit order: breakglass.ts must run first, it tests registering the
# protocol config (the other files reuse that config). Add new test files here.
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/breakglass.ts tests/pause.ts tests/outflow.ts tests/timelock.ts tests/attack.ts tests/timelock-warp.ts"

[test]
# Load programs as upgradeable with the wallet as upgrade authority, like a
# real deploy. initialize_config requires the upgrade authority's signature.
upgradeable = true

# Accounts preloaded into the `anchor test` validator (generated by scripts/gen-fixtures.js).
[[test.validator.account]]
address = "FakePauseState11111111111111111111111111111"
filename = "tests/fixtures/fake-pause-state.json"
