[package]
name = "breakglass"
version = "0.1.0"
description = "Breakglass: emergency circuit breaker and outflow gate for Solana protocols"
edition = "2021"
# Solana 2.1 platform-tools (v1.43) ship rustc 1.79. Keeps `cargo update` on compatible crates.
rust-version = "1.79"

[lib]
crate-type = ["cdylib", "lib"]
name = "breakglass"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=0.31.1", features = ["event-cpi", "init-if-needed"] }

[dev-dependencies]
proptest = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
