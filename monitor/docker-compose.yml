# Local Postgres for the monitor (used from Phase 5).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: breakglass
      POSTGRES_PASSWORD: breakglass
      POSTGRES_DB: breakglass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
